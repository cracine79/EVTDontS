<form action="/videos" method="get" role="search" class="flex justify-center h-12 w-full">
  <input name="q" value="{{ q or '' }}" aria-label="Search economics videos"
         class="w-1/2 border-white bg-transparent text-white border-b pl-4 focus:outline-none placeholder-white text-xxs sm:text-sm focus:ring-0"
         placeholder="Search For Econ Videos Here">
  <button type="submit" aria-label="Search" class="bg-transparent w-1/12 min-w-12 border-white border-b text-2xl text-white hover:text-[#344A53]"><i class="fa-solid fa-magnifying-glass"></i></button>
</form>
