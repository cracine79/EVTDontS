<form action="/videos" method="get" role="search" class="flex h-10 w-full">
  <input name="q" value="{{ q or '' }}" aria-label="Search economics videos"
         class="flex-1 min-w-0 border-white bg-transparent text-white border-b pl-2 focus:outline-none placeholder-white text-sm focus:ring-0"
         placeholder="Search For Econ Videos Here">
  <button type="submit" aria-label="Search" class="bg-transparent px-3 border-white border-b text-xl text-white hover:text-[#344A53]"><i class="fa-solid fa-magnifying-glass"></i></button>
</form>
